   THESIS: Orbit is a wayfinding system, not a chat app: saturated yellow sign bands carry one message each, status reads as gate numbers, the transcript is a corridor of decision points.
   OWN-WORLD: midnight enamel ground, porcelain text, one saturated yellow reserved for wayfinding alone; humanist sans in sentence case; hairline seams, no resting shadows; arrows locked to edges.
   STORY: A developer glancing at a phone knows in one beat which pane needs them, where to go, and what to do; the terminal stays one tap away.
   FIRST VIEWPORT: a midnight ground under a yellow-edged header whose brand sits on a yellow sign plate; transcript rows beneath; the composer a squared, yellow-edged input band at the foot; no decorative chrome.
   FORM: wayfinding-cartography-signage-terminal-yellow-wayfinding; seed key 87a22b46 (direction, operate), surface deal e8958e3c, dealt index 3.
   FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
